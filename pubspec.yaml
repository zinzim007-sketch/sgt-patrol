name: sgt_patrol
description: SGT Patrol — drone patrol operator app
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.0.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
    
 
  # State management
  provider: ^6.1.2
 
  # Maps
  google_maps_flutter: ^2.6.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
 
  # Navigation
  go_router: ^13.2.0
 
  web_socket_channel: ^2.4.0
 
  # Utilities
  intl: ^0.19.0
  
  dart_mavlink: 0.1.0
  roslibdart: 0.0.1-dev+4
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
 
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/demo/